# Server + automatic HTTPS (Caddy gets a Let's Encrypt certificate for your domain).
# 1. Point a DNS A record (e.g. library.example.org) at this machine.
# 2. Replace library.example.org below and in Caddyfile.
# 3. docker compose up -d
services:
  elibrary:
    build: ..
    restart: unless-stopped
    environment:
      ELIB_PUBLIC_URL: https://library.example.org
      # ELIB_ALLOW_SIGNUP: "1"      # allow more than one parent account
      # ELIB_MAX_UPLOAD_MB: "2048"
    volumes:
      - elibrary-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - elibrary

volumes:
  elibrary-data:
  caddy-data:
